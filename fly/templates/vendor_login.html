{% extends 'fly/base.html' %}
{% load static %}

{% block title %}Vendor Login{% endblock %}

{% block background_image %}
background: url("{% static 'images/user_bg.jpg' %}") no-repeat center center fixed;
{% endblock %}

{% block content %}
<h2>Vendor Login</h2>
<form method="POST">{% csrf_token %}
    <input type="text" name="username" placeholder="Vendor Username" required><br><br>
    <input type="password" name="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
</form>
{% endblock %}
